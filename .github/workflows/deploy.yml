name: Deploy AlphaOS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; skip in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 24 matches the local dev environment and clears the runner's
      # Node 20 deprecation warning.
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # API routes require a running server and cannot be statically exported.
      # The app falls back to built-in static data when the API is unavailable.
      - name: Remove server-only API routes
        run: rm -rf src/app/api

      - name: Build static export
        run: npm run build
        env:
          # Supabase — baked into client bundle at build time.
          # These were hardcoded to project mxwrfiihmfmlhtmynpal, which has been
          # deleted. They now come from repo Secrets so that pointing AlphaOS at a
          # new project is "set two secrets", with no workflow edit and no redeploy
          # of this file. If unset, src/lib/supabase.ts yields a null client and the
          # app falls back to static data rather than failing the build.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # AlphaBot — Groq streaming (add GROQ_API_KEY in GitHub repo Secrets)
          NEXT_PUBLIC_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Market Intel — Finnhub live news (add FINNHUB_API_KEY in GitHub repo Secrets)
          NEXT_PUBLIC_FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Commodities — gold spot/history via Twelve Data (add TWELVEDATA_API_KEY
          # in repo Secrets, otherwise /commodities shows gold as unavailable).
          NEXT_PUBLIC_TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          # Commodities — WTI/Brent $/barrel via Alpha Vantage. Optional: the code
          # falls back to Alpha Vantage's shared "demo" key, which works but is
          # throttled. Add ALPHAVANTAGE_API_KEY for a dedicated 25 req/day quota.
          NEXT_PUBLIC_ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          NEXT_PUBLIC_API_URL: ""

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
